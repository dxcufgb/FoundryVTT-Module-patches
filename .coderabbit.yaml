# CodeRabbit settings for FoundryVTT-Module-patches.
# Shared rules come from the central dxcufgb/coderabbit repository (inheritance: true), and CodeRabbit reads
# CLAUDE.md as code guidelines. Only what is specific to this repository is here.
# Check the merged result on a pull request with: @coderabbitai configuration
inheritance: true

reviews:
  path_instructions:
    - path: "scripts/patches/**"
      instructions: |
        A patch must never break Foundry when the patched module changes or is missing: guard every lookup of the
        other module's classes and methods and fail soft. Each patch exports key, module, apply() and optional
        settings, is listed in PATCHES, has Name/Hint strings in lang/en.json, a README row, and its module in
        module.json `recommends`. Wrapped methods must call through to the original and keep its return value.
    - path: ".github/workflows/{ci,release}.yml"
      instructions: |
        Thin callers of dxcufgb/foundry-module-ci, identical in every Foundry module repository. Flag any change
        here that is not the same change in all modules (it belongs in foundry-module-ci instead), except the
        pinned SHA of foundry-module-ci itself.
